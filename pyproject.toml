# Settings for the code checkers only. The integration itself is installed by
# copying custom_components/sunmon, not from this file.

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "UP", "SIM", "PL", "RUF"]
ignore = [
    "E501",  # line length is left to the formatter
    "PLR0913",  # too many arguments
    "PLR2004",  # magic values: the protocol is full of fixed offsets and lengths
]

[tool.ruff.lint.isort]
# Import order as in Home Assistant
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true

[tool.mypy]
python_version = "3.13"
